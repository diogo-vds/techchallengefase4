name: Deploy API Avaliações

on:
  push:
    branches:
      - main
    paths:
      - 'api-avaliacao/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem Docker
        run: |
          docker build -t api-avaliacoes ./api-avaliacao

      - name: Tag da imagem
        run: |
          docker tag api-avaliacoes:latest \
          303956760468.dkr.ecr.us-east-1.amazonaws.com/api-avaliacoes:latest

      - name: Push da imagem
        run: |
          docker push \
          303956760468.dkr.ecr.us-east-1.amazonaws.com/api-avaliacoes:latest

      - name: Atualizar serviço ECS
        run: |
          aws ecs update-service \
            --cluster techchallenge-cluster \
            --service api-avaliacoes-service \
            --force-new-deployment